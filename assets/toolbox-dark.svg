<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title id="title">What I work with</title>
<desc id="desc">Voice AI: LiveKit, SIP trunking, Gemini Live, OpenAI Realtime, Amazon Nova Sonic, Deepgram, Sarvam, Knowledge-base retrieval. Prompts: System prompts, Conversation flows, Evaluation on real calls, Hindi, Hinglish, English. Build: TypeScript, Next.js, React, Python, Supabase, Postgres, Vercel. Product: Use-case discovery, PRDs, Roadmaps, Prioritisation, Go-to-market. Analytics: SQL, GA4, Mixpanel, CleverTap, A/B testing, Funnel analysis.</desc>
