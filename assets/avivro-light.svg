999999999997 209h16m-5 -4l5 4l-5 4" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="516.0999999999999" y="178.5" width="130.2" height="61" rx="10" fill="#eaf3fe" stroke="#2a78d6"/><text x="581.1999999999999" y="205" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Voice agent</text><text x="581.1999999999999" y="223" font-size="11.5" text-anchor="middle" fill="#6f6e69">prompt + knowledge</text><path d="M653.8 209h16m-5 -4l5 4l-5 4" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="677.3" y="178.5" width="130.2" height="61" rx="10" fill="#f6f8fa" stroke="#d9dee5"/><text x="742.4" y="205" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Call record</text><text x="742.4" y="223" font-size="11.5" text-anchor="middle" fill="#6f6e69">for every call</text><text x="32" y="278" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.4" text-anchor="start" fill="#6f6e69">SPEECH ENGINES</text><rect x="192.5" y="262.5" width="85" height="23" rx="12" fill="#eaf3fe" stroke="#2a78d6"/><text x="235" y="278.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Gemini Live</text><rect x="286.5" y="262.5" width="115" height="23" rx="12" fill="#eaf3fe" stroke="#2a78d6"/><text x="344" y="278.32" font-size="12" text-anchor="middle" fill="#0b0b0b">OpenAI Realtime</text><rect x="410.5" y="262.5" width="129" height="23" rx="12" fill="#eaf3fe" stroke="#2a78d6"/><text x="475" y="278.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Amazon Nova Sonic</text><rect x="548.5" y="262.5" width="184" height="23" rx="12" fill="#eaf3fe" stroke="#2a78d6"/><text x="640.5" y="278.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Cascade: Deepgram + Sarvam</text><text x="32" y="314" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.4" text-anchor="start" fill="#6f6e69">EACH CALL RETURNS</text><rect x="192.5" y="298.5" width="76" height="23" rx="12" fill="#f6f8fa" stroke="#d9dee5"/><text x="230.5" y="314.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Transcript</text><rect x="277.5" y="298.5" width="74" height="23" rx="12" fill="#f6f8fa" stroke="#d9dee5"/><text x="314.5" y="314.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Recording</text><rect x="360.5" y="298.5" width="90" height="23" rx="12" fill="#f6f8fa" stroke="#d9dee5"/><text x="405.5" y="314.32" font-size="12" text-anchor="middle" fill="#0b0b0b">AI summary</text><rect x="459.5" y="298.5" width="68" height="23" rx="12" fill="#f6f8fa" stroke="#d9dee5"/><text x="493.5" y="314.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Outcome</text><rect x="536.5" y="298.5" width="84" height="23" rx="12" fill="#f6f8fa" stroke="#d9dee5"/><text x="578.5" y="314.32" font-size="12" text-anchor="middle" fill="#0b0b0b">Diagnostics</text><line x1="32" y1="344" x2="808" y2="344" stroke="#d9dee5"/><text x="32" y="390" font-size="28" font-weight="700" fill="#0b0b0b">11</text><text x="32" y="412" font-size="12.5" fill="#52514e">languages: Hindi, English and</text><text x="32" y="429" font-size="12.5" fill="#52514e">nine more</text><text x="226" y="390" font-size="28" font-weight="700" fill="#0b0b0b">4</text><text x="226" y="412" font-size="12.5" fill="#52514e">speech paths: three live</text><text x="226" y="429" font-size="12.5" fill="#52514e">engines or a cascade</text><text x="420" y="390" font-size="28" font-weight="700" fill="#0b0b0b">4</text><text x="420" y="412" font-size="12.5" fill="#52514e">team roles, with an audit log</text><text x="614" y="390" font-size="28" font-weight="700" fill="#0b0b0b">3</text><text x="614" y="412" font-size="12.5" fill="#52514e">paid plans on a prepaid rupee</text><text x="614" y="429" font-size="12.5" fill="#52514e">wallet</text>
