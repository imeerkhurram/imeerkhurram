<svg xmlns="http://www.w3.org/2000/svg" width="840" height="459" viewBox="0 0 840 459" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title id="title">Avivro Voice: Live at app.avivro.com</title>
<desc id="desc">A multi-tenant platform where a business builds an AI voice agent, connects an Indian phone number and takes real inbound and outbound calls. Call path: Phone call, then SIP trunk, then LiveKit, then Voice agent, then Call record. Speech engines: Gemini Live, OpenAI Realtime, Amazon Nova Sonic, Cascade: Deepgram + Sarvam. Each call returns: Transcript, Recording, AI summary, Outcome, Diagnostics. 11 languages: Hindi, English and nine more. 4 speech paths: three live engines or a cascade. 4 team roles, with an audit log. 3 paid plans on a prepaid rupee wallet.</desc>
<rect x="0.5" y="0.5" width="839" height="458" rx="12" fill="#ffffff" stroke="#d9dee5"/>
