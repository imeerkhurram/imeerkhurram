name: Update activity card

on:
  schedule:
    # 06:47 and 18:47 IST
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild card from the contribution calendar
        run: node scripts/update-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Committed as the Actions bot, so these refreshes never count as
      # contributions on the profile they are reporting on.
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Card already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "Refresh activity card"
          git push
